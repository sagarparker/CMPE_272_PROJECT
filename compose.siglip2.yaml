# Optional local trial. Populate the SigLIP 2 index before switching search.
services:
  backend:
    environment:
      ML_SEARCH_MIN_SIMILARITY: ${ML_SEARCH_MIN_SIMILARITY:-0.67}
  ml-api:
    environment:
      ML_EMBEDDING_MODEL: siglip2
  ml-worker:
    environment:
      ML_EMBEDDING_MODEL: siglip2
