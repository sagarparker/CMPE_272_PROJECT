name: MediaMesh CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: compose.yaml:infra/compose.ci.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./infra/check.sh
      - name: Secret and known-exploited dependency gate
        run: ./infra/security-check.sh
      - name: Start CI smoke-test stack
        # Real hosted/local inference is exercised separately; CI covers its clients and job flow.
        env:
          ML_EMBEDDING_MODEL: clip
          ML_CAPTION_ENABLED: "false"
          ML_VERIFY_CAPTIONS: "false"
          ML_SEARCH_MIN_SIMILARITY: "0.25"
        run: |
          docker compose up -d --build --wait --wait-timeout 180 postgres keycloak azurite blob-init backend frontend
          docker compose up -d --no-deps --build ml-api ml-worker
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for model and API readiness
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS --connect-timeout 2 --max-time 3 http://localhost:8080/health && docker compose exec -T ml-api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - name: Container logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-details
          path: |
            compose.log
            frontend/test-results
            backend/target/surefire-reports
      - if: always()
        run: docker compose --profile test down -v
