log_format mediamesh_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","requestId":"$request_id","method":"$request_method","status":$status,"durationSeconds":$request_time}';
server {
 listen 80;
 server_name _;
 access_log /dev/stdout mediamesh_json;
 client_max_body_size 1m;
 proxy_connect_timeout 3s;
 proxy_send_timeout 10s;
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Request-ID $request_id; proxy_read_timeout 90s; }
 location /health { proxy_pass http://backend:8080; }
 location /auth/ { proxy_pass http://keycloak:8080; proxy_set_header Host $http_host; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $http_host; }
 location / { root /usr/share/nginx/html; try_files $uri /index.html; add_header Cache-Control "no-store"; }
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy no-referrer;
}
